<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440">
  <!-- DMG window background (scripts/dmg-settings.py places the icons at 180,170 and 480,170).
       Light on purpose: Finder draws icon labels in black over a background picture. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfa"/>
      <stop offset="1" stop-color="#eeeeeb"/>
    </linearGradient>
    <radialGradient id="glow" cx="180" cy="165" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7ce0ae" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7ce0ae" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="480" cy="165" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6aa8ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6aa8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.9" fill="#000000" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f9d6b" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#1f9d6b" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="660" height="440" fill="url(#bg)"/>
  <rect width="660" height="440" fill="url(#dots)"/>
  <rect width="660" height="440" fill="url(#glow)"/>
  <rect width="660" height="440" fill="url(#glow2)"/>

  <!-- Drag arrow between the two icons: a curve whose head follows its end direction -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M264 174 Q330 146 394 172" stroke="url(#arrow)" stroke-width="2.5"/>
    <path d="M388.5 162.5 L394 172 L383.4 175.0" stroke="#1f9d6b" stroke-width="2.5"/>
  </g>

  <!-- Caption, kept clear of the bottom where Finder may show its path and status bars -->
  <rect x="210" y="262" width="240" height="1" fill="#000000" fill-opacity="0.08"/>
  <text x="330" y="290" text-anchor="middle" font-family="SF Pro Display, SF Pro Text, Helvetica Neue, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#1d1e22">Drag Termorc into Applications</text>
  <text x="330" y="311" text-anchor="middle" font-family="SF Pro Text, Helvetica Neue, Helvetica, sans-serif" font-size="11.5" fill="#6c6e75">A terminal where sessions live in a sidebar, grouped into Spaces</text>
</svg>
