<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f4f6"/>
    </linearGradient>
    <filter id="drop" color-interpolation-filters="sRGB" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" color-interpolation-filters="sRGB" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
      <feOffset dy="18"/>
      <feComponentTransfer><feFuncA type="linear" slope="1.6"/></feComponentTransfer>
    </filter>
    <clipPath id="tileClip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>
  <!-- macOS icon grid: an 824px tile centred on a 1024 canvas, room left for the shadow -->
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  </g>
  <!-- Faceted >_ artwork (icon-art.png, transparent), centred on the tile over a blurred copy of itself as glow -->
  <g clip-path="url(#tileClip)">
    <image x="48.5" y="100.7" width="921.6" height="921.6" xlink:href="icon-art.png" href="icon-art.png" filter="url(#glow)" opacity="0.85"/>
    <image x="48.5" y="100.7" width="921.6" height="921.6" xlink:href="icon-art.png" href="icon-art.png"/>
  </g>
</svg>
